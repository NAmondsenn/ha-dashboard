swipe_nav:
  wrapping: false
  animate: swipe
kiosk_mode:
  kiosk: true
navbar-templates:
  mobile:
    desktop:
      position: bottom
    mobile:
      mode: floating
    routes:
      - url: /dashboard-mobile/homelab
        icon: mdi:server
      - url: /dashboard-mobile/home
        icon: mdi:home
      - url: /dashboard-mobile/planner
        icon: mdi:notebook
      - icon: >
          [[[ return window.location.search.includes('disable_km') ? 'mdi:check'
          : 'mdi:pencil'; ]]]
        tap_action:
          action: custom-js-action
          code: |
            [[[
              // Pencil enters edit mode with kiosk off; tick reloads the clean URL to restore kiosk.
              // Also the only way out of kiosk on the phone, since kiosk hides the sidebar
              const editing = window.location.search.includes('disable_km');
              window.location.href = window.location.pathname + (editing ? '' : '?disable_km&edit=1');
            ]]]
    styles: >
      /* Same pill as the desktop navbar, with slightly bigger touch targets */

      .navbar {
        --navbar-route-icon-size: 22px;
      }

      .navbar-card.desktop.bottom {
        margin-bottom: 20px !important;
      }

      .navbar-card {
        padding: 4px 6px !important;
        gap: 4px !important;
      }

      .route {
        padding: 0 !important;
      }

      .button {
        width: 48px !important;
        height: 44px !important;
      }


      /* Hairline before the edit button so it doesn't read as another view;
         drawn inside the item's own box so the route can't clip it */
      .route:last-child {
        position: relative;
        margin-left: 2px;
        padding-left: 7px !important;
      }

      .route:last-child::before {
        content: '';
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 1px;
        background: var(--secondary-text-color);
        opacity: 0.35;
      }


      /* Glass pill; 0.08 matches the nested tiles, which stack two 0.04 layers
      */

      .navbar-card {
        background: rgba(255, 255, 255, 0.08) !important;
        backdrop-filter: blur(12px);
        border: 1px solid var(--divider-color) !important;
        border-radius: 12px !important;
        box-shadow: none !important;
      }


      /* Drop the filled square; the underline marks the active tab instead */

      .button,

      .button.active {
        background: transparent !important;
        position: relative;
      }

      .button.active::after {
        content: '';
        position: absolute;
        left: 25%;
        right: 25%;
        bottom: 2px;
        height: 2px;
        border-radius: 2px;
        background: var(--primary-text-color);
      }


      /* Dim inactive icons so the current tab stands out */

      .icon { color: var(--secondary-text-color); }

      .icon.active { color: var(--primary-text-color); }
views:
  - title: Homelab
    path: homelab
    theme: glass
    icon: mdi:server-network
    type: sections
    max_columns: 2
    header:
      layout: start
      card:
        type: markdown
        text_only: true
        content: '# Homelab'
        card_mod:
          style:
            ha-markdown$: |
              h1, p {
                text-align: left !important;
              }
              h1 {
                font-size: 2.8em !important;
                font-weight: 700 !important;
                margin: 0 !important;
                line-height: 1 !important;
                letter-spacing: -0.02em;
              }
            .: |
              ha-card {
                text-align: left !important;
                background: none;
                border: none;
                box-shadow: none;
                padding-top: 28px !important;
                padding-bottom: 4px !important;
              }
    footer:
      card:
        type: custom:navbar-card
        template: mobile
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              {% set svc = [
                ['truenas', 'binary_sensor.truenas_status'],
                ['nextcloud', 'binary_sensor.nextcloud_status'],
                ['vaultwarden', 'binary_sensor.vaultwarden_status'],
                ['home-assistant', 'binary_sensor.home_assistant_status'],
                ['adguard', 'binary_sensor.adguard_status'],
                ['homepage', 'binary_sensor.homepage_status'],
                ['pbs', 'binary_sensor.pbs_status'],
                ['ntfy', 'binary_sensor.ntfy_status'],
              ] %}

              {% set ns = namespace(down=[], issues=[]) %}

              {% for name, e in svc %}{% if not is_state(e, 'on') %}{% set
              ns.down = ns.down + [name] %}{% endif %}{% endfor %}

              {% if ns.down %}{% set ns.issues = ns.issues + [ns.down | join(',
              ') ~ (' is' if ns.down | count == 1 else ' are') ~ ' down'] %}{%
              endif %}

              {% if states('sensor.backups_failed_count') | int(0) > 0 %}{% set
              ns.issues = ns.issues + ['Backup check failing ·
              [Healthchecks](https://healthchecks.io/)'] %}{% endif %}

              {% for name, e in [['NAS', 'sensor.nas_pool_health'], ['Backups',
              'sensor.backups_pool_health']] %}{% if states(e) | lower not in
              ['online', 'healthy', 'ok'] %}{% set ns.issues = ns.issues + [name
              ~ ' pool is ' ~ states(e)] %}{% endif %}{% endfor %}

              {% set days = states('sensor.amondsen_uk_days_until_expiration') |
              int(999) %}

              {% if days < 30 %}{% set ns.issues = ns.issues + ['amondsen.uk
              expires in ' ~ days ~ ' days'] %}{% endif %}

              {% if is_state('update.nextcloud_amondsen_uk', 'on') %}{% set
              ns.issues = ns.issues + ['Nextcloud update available'] %}{% endif
              %}

              {% if ns.issues %}

              ### <ha-icon icon="mdi:alert-circle"></ha-icon> {{ ns.issues |
              count }} {{ 'issue' if ns.issues | count == 1 else 'issues' }}

              {% for i in ns.issues %}

              - {{ i }}

              {% endfor %}

              {% else %}

              ### <ha-icon icon="mdi:check-circle"></ha-icon> All systems OK

              {{ svc | count }} services up · backups passing

              {% endif %}
            card_mod:
              class: glass
              style:
                ha-markdown$: |
                  h3 {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    margin: 0 0 4px 0 !important;
                    font-size: 1.15em !important;
                  }
                  p, ul {
                    margin: 0 !important;
                    opacity: 0.7;
                  }
                  ha-icon[icon="mdi:check-circle"] {
                    color: var(--success-color, #4caf50);
                  }
                  ha-icon[icon="mdi:alert-circle"] {
                    color: var(--error-color);
                  }
          - type: custom:mod-card
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Proxmox
                  icon: phu:proxmox
                - type: heading
                  heading: pve1
                  heading_style: subtitle
                  tap_action:
                    action: url
                    url_path: https://192.168.0.39:8006
                - type: horizontal-stack
                  cards:
                    - type: tile
                      entity: sensor.bedroom_pve1_cpu_usage
                      name: CPU
                      card_mod:
                        class: glass
                    - type: tile
                      entity: sensor.bedroom_pve1_memory_usage_percentage
                      name: RAM
                      card_mod:
                        class: glass
                - type: heading
                  heading: pve2
                  heading_style: subtitle
          - type: custom:mod-card
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Storage
                  icon: mdi:nas
                  sub_button:
                    - icon: mdi:open-in-new
                      tap_action:
                        action: url
                        url_path: https://192.168.0.40
                - type: horizontal-stack
                  cards:
                    - type: tile
                      entity: sensor.nas_pool_free
                      name: NAS Free
                      icon: mdi:harddisk
                      card_mod:
                        class: glass
                    - type: tile
                      entity: sensor.backups_pool_free
                      name: Backups Free
                      icon: mdi:harddisk
                      card_mod:
                        class: glass
                - type: tile
                  entity: sensor.storage_pbs_storage_usage_percentage
                  name: PBS datastore
                  card_mod:
                    class: glass
          - type: custom:mod-card
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Network
                  icon: mdi:lan
                - type: horizontal-stack
                  cards:
                    - type: tile
                      entity: switch.adguard_home_protection
                      name: AdGuard
                      icon: phu:adguard
                      color: green
                      tap_action:
                        action: toggle
                      icon_hold_action:
                        action: url
                        url_path: http://192.168.0.23/
                      card_mod:
                        class: glass
                    - type: tile
                      entity: sensor.adguard_home_dns_queries_blocked_ratio
                      name: Blocked
                      card_mod:
                        class: glass
          # Only links with no other way in; Proxmox, TrueNAS and AdGuard open from pve1, Storage and the AdGuard tile
          - type: custom:mod-card
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Open
                  icon: mdi:open-in-new
                - type: horizontal-stack
                  cards:
                    - type: tile
                      entity: binary_sensor.pbs_status
                      name: PBS
                      icon: phu:proxmox
                      vertical: true
                      hide_state: true
                      color: none
                      tap_action:
                        action: url
                        url_path: https://192.168.0.45:8007
                      icon_tap_action:
                        action: url
                        url_path: https://192.168.0.45:8007
                      card_mod:
                        class: glass
                    - type: tile
                      entity: binary_sensor.nextcloud_status
                      name: Nextcloud
                      icon: phu:nextcloud
                      vertical: true
                      hide_state: true
                      color: none
                      tap_action:
                        action: url
                        url_path: https://nextcloud.amondsen.uk
                      icon_tap_action:
                        action: url
                        url_path: https://nextcloud.amondsen.uk
                      card_mod:
                        class: glass
                    - type: tile
                      entity: binary_sensor.homepage_status
                      name: Homepage
                      icon: mdi:view-dashboard-variant
                      vertical: true
                      hide_state: true
                      color: none
                      tap_action:
                        action: url
                        url_path: https://homepage.amondsen.uk
                      icon_tap_action:
                        action: url
                        url_path: https://homepage.amondsen.uk
                      card_mod:
                        class: glass
      - type: grid
        cards: []
  - title: Home
    path: home
    theme: glass
    icon: mdi:home
    type: sections
    max_columns: 2
    header:
      layout: start
      card:
        type: markdown
        text_only: true
        content: >
          {% set d = now().day %}

          {% set suf = 'th' if d in [11,12,13] else {1:'st',2:'nd',3:'rd'}.get(d
          % 10, 'th') %}

          {% set w = 'weather.forecast_home' %}

          {% set t = state_attr(w, 'temperature') %}

          {% set c = states(w) %}

          {% set conds = {'clear-night': ['Clear', 'weather-night'], 'cloudy':
          ['Cloudy', 'weather-cloudy'], 'fog': ['Fog', 'weather-fog'], 'hail':
          ['Hail', 'weather-hail'], 'lightning': ['Lightning',
          'weather-lightning'], 'lightning-rainy': ['Storms',
          'weather-lightning-rainy'], 'partlycloudy': ['Partly cloudy',
          'weather-partly-cloudy'], 'pouring': ['Pouring', 'weather-pouring'],
          'rainy': ['Rain', 'weather-rainy'], 'snowy': ['Snow',
          'weather-snowy'], 'snowy-rainy': ['Sleet', 'weather-snowy-rainy'],
          'sunny': ['Sunny', 'weather-sunny'], 'windy': ['Windy',
          'weather-windy'], 'windy-variant': ['Windy', 'weather-windy-variant'],
          'exceptional': ['Warning', 'alert-circle-outline']} %}

          {% set cond = conds.get(c, [c, 'weather-cloudy']) %}

          {% set h = now().hour %}

          Good {{ 'morning' if 5 <= h < 12 else 'afternoon' if 12 <= h < 17 else
          'evening' }},


          # Nathaniel


          {{ now().strftime('%A') }}, {{ d }}{{ suf }} {{ now().strftime('%B')
          }}


          {% if t is number %}<ha-icon icon="mdi:{{ cond[1] }}"></ha-icon> {{ t
          | round | int }}° {{ cond[0] }}{% endif %}
