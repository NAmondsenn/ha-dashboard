    cards: []
  - title: Planner
    path: planner
    theme: glass
    icon: mdi:notebook
    type: sections
    max_columns: 4
    footer:
      card:
        type: custom:navbar-card
        template: default
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: markdown
                text_only: true
                content: '# Planner'
                card_mod:
                  style:
                    ha-markdown$: |
                      h1 {
                        font-size: 5em !important;
                        font-weight: 700 !important;
                        margin: 0 !important;
                        line-height: 1 !important;
                        letter-spacing: -0.02em;
                      }
                    .: >
                      /* Top-aligned and the same size as the clock, so title
                      and time share one top edge */

                      ha-card {
                        text-align: left;
                        background: none;
                        border: none;
                        box-shadow: none;
                        padding: 20px 0;
                        height: 100%;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        justify-content: flex-start;
                      }
              - type: markdown
                text_only: true
                content: >-
                  {% set d = now().day %}

                  {% set suf = 'th' if d in [11,12,13] else
                  {1:'st',2:'nd',3:'rd'}.get(d % 10, 'th') %}

                  # {{ now().strftime('%H:%M') }}

                  {{ now().strftime('%A') }}, {{ d }}{{ suf }} {{
                  now().strftime('%B %Y') }}
                card_mod:
                  style:
                    ha-markdown$: |
                      h1 {
                        font-size: 5em !important;
                        font-weight: 700 !important;
                        margin: 0 !important;
                        line-height: 1 !important;
                        letter-spacing: -0.02em;
                      }
                      p {
                        font-size: 1.25em !important;
                        opacity: 0.6;
                        margin: 10px 0 0 0 !important;
                      }
                    .: |
                      ha-card {
                        text-align: right;
                        background: none;
                        border: none;
                        box-shadow: none;
                        padding: 20px 0;
                        height: 100%;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        justify-content: flex-start;
                      }
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Notepad
            icon: mdi:note-text
          - type: todo-list
            entity: todo.notepad
            display_order: none
            card_mod:
              class: glass
              style:
                ha-check-list-item$: |
                  /* A scratchpad, not a checklist */
                  ha-checkbox {
                    display: none !important;
                  }
                .: |
                  /* Runs down to just above the navbar on any screen height */
                  ha-card {
                    padding: 0 0 12px 0 !important;
                    min-height: calc(100vh - 416px);
                  }
                  .header,
                  .empty {
                    display: none !important;
                  }
                  ha-input {
                    width: 100%;
                    margin: 0 !important;
                  }
                ha-input$: >
                  /* HA internals (wa-input fields): recheck these after HA
                  updates */

                  wa-input {
                    --wa-form-control-background-color: rgba(255, 255, 255, 0.04);
                  }

                  wa-input::part(base) {
                    background: rgba(255, 255, 255, 0.04) !important;
                    border-radius: 10px 10px 0 0;
                  }
