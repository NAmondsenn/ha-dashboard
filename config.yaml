                    ha-card {
                      --card-mod-icon: {{ {'In use': 'mdi:monitor-dashboard', 'Asleep': 'mdi:sleep', 'Locked': 'mdi:lock', 'Screen off': 'mdi:monitor-off', 'Idle': 'mdi:timer-sand', 'Off': 'mdi:power-off'}.get(states(config.entity), 'mdi:laptop') }};
                    }
              - type: tile
                entity: sensor.macbook_pro_internal_battery_level
                name: Battery
                card_mod:
                  class: glass
                  style: >
                    /* Grey like every other icon; only goes red when the
                    battery is actually low */

                    ha-card {
                      --tile-color: {{ 'var(--red-color)' if states(config.entity) | int(100) <= 20 else 'var(--state-inactive-color)' }} !important;
                    }
          - type: custom:bubble-card
            card_type: separator
            name: Lights
            icon: mdi:lightbulb
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.bedroom_light
            name: Bedroom light
            icon: mdi:lightbulb
            state_content: state
