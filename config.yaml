                    ha-card {
                      --card-mod-icon: {{ 'mdi:signal-cellular-3' if states(config.entity) == 'Mobile data' else 'mdi:wifi-off' if states(config.entity) in ['Not connected', 'unavailable', 'unknown'] else 'mdi:wifi' }};
                    }
