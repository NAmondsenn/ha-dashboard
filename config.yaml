            styles: >
              /* Standard glass and 12px corners, like every other card */

              ha-card {
                --bubble-border-radius: 12px;
              }

              .bubble-button-card-container {
                background: rgba(255, 255, 255, 0.04) !important;
                backdrop-filter: blur(12px);
                border: 1px solid var(--divider-color);
                border-radius: 12px !important;
              }

              /* Glass fill rather than the bulb colour at full strength; the
              icon still carries the colour */

              .bubble-range-fill {
                background-color: rgba(255, 255, 255, 0.18) !important;
              }
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.lamp
            name: Lamp
            icon: mdi:floor-lamp
            state_content: state
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            button_action:
              double_tap_action:
                action: more-info
            styles: >
              /* Standard glass and 12px corners, like every other card */

              ha-card {
                --bubble-border-radius: 12px;
              }

              .bubble-button-card-container {
                background: rgba(255, 255, 255, 0.04) !important;
                backdrop-filter: blur(12px);
                border: 1px solid var(--divider-color);
                border-radius: 12px !important;
              }

              /* Glass fill rather than the bulb colour at full strength; the
              icon still carries the colour */

              .bubble-range-fill {
                background-color: rgba(255, 255, 255, 0.18) !important;
              }
  - title: Homelab
