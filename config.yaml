                      /* Top-aligned and the same size as the clock, so title
                      and time share one top edge */

                      ha-card {
                        text-align: left;
                        background: none;
                        border: none;
                        box-shadow: none;
                        padding: 20px 0;
                        height: 100%;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        justify-content: flex-start;
                      }
              - type: markdown
                text_only: true
                content: >-
                  {% set d = now().day %}

                  {% set suf = 'th' if d in [11,12,13] else
                  {1:'st',2:'nd',3:'rd'}.get(d % 10, 'th') %}

                  # {{ now().strftime('%H:%M') }}

                  {{ now().strftime('%A') }}, {{ d }}{{ suf }} {{
                  now().strftime('%B %Y') }}
                card_mod:
                  style:
                    ha-markdown$: |
                      h1 {
                        font-size: 5em !important;
                        font-weight: 700 !important;
                        margin: 0 !important;
                        line-height: 1 !important;
                        letter-spacing: -0.02em;
                      }
                      p {
                        font-size: 1.25em !important;
                        opacity: 0.6;
                        margin: 10px 0 0 0 !important;
                      }
                    .: |
                      ha-card {
                        text-align: right;
                        background: none;
                        border: none;
                        box-shadow: none;
                        padding: 20px 0;
                        height: 100%;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        justify-content: flex-start;
                      }
          - type: markdown
            show_empty: false
            grid_options:
              columns: full
            content: >-
              {#- Renders nothing while all is well, so show_empty: false hides
              the card. Keep in step with the navbar badge. -#}

              {%- set ns = namespace(issues=[]) -%}

              {%- for s in ['truenas', 'nextcloud', 'vaultwarden',
              'home_assistant', 'adguard', 'homepage', 'pbs', 'ntfy',
              'jellyfin', 'immich', 'jellyfin_stack', 'navidrome',
              'nginxproxymanager'] -%}
                {%- if is_state('binary_sensor.' ~ s ~ '_status', 'off') -%}
                  {%- set ns.issues = ns.issues + [s | replace('_', '-') ~ ' down'] -%}
                {%- endif -%}
              {%- endfor -%}

              {%- if states('binary_sensor.download_vpn') in ['off',
              'unavailable'] -%}
                {%- set ns.issues = ns.issues + ['download VPN down'] -%}
              {%- endif -%}

              {%- if is_state('binary_sensor.soulsync_soulseek', 'off') -%}
                {%- set ns.issues = ns.issues + ['soulseek disconnected'] -%}
              {%- endif -%}

              {%- for e, label in [('sensor.nas_pool_health', 'nas pool'),
              ('sensor.backups_pool_health', 'backups pool'),
              ('sensor.media_disk_health', 'media disk')] -%}
                {%- if states(e) != 'ONLINE' -%}
                  {%- set ns.issues = ns.issues + [label ~ ' ' ~ states(e) | lower] -%}
                {%- endif -%}
              {%- endfor -%}

              {%- set failed = states('sensor.backups_failed_count') | int(0)
              -%}

              {%- if failed > 0 -%}
                {%- set ns.issues = ns.issues + [failed ~ ' check' ~ ('s' if failed > 1 else '') ~ ' failing'] -%}
              {%- endif -%}

              {%- set days = states('sensor.amondsen_uk_days_until_expiration')
              | int(999) -%}

              {%- if days < 30 -%}
                {%- set ns.issues = ns.issues + ['amondsen.uk expires in ' ~ days ~ ' days'] -%}
              {%- endif -%}

              {%- set lvm =
              states('sensor.storage_local_lvm_storage_usage_percentage_2') |
              float(0) -%}

              {%- if lvm > 85 -%}
                {%- set ns.issues = ns.issues + ['pve2 local-lvm at ' ~ lvm | round(0) | int ~ '%'] -%}
              {%- endif -%}

              {%- set free = states('sensor.storage_library_available_storage')
              | float(999) -%}

              {%- if free < 50 -%}
                {%- set ns.issues = ns.issues + ['media disk down to ' ~ free | round(0) | int ~ ' GiB free'] -%}
              {%- endif -%}

              {%- if ns.issues | count > 0 -%}

              <ha-icon icon="mdi:alert-circle-outline"></ha-icon> **Needs
              attention:** {{ ns.issues | join(', ') }}

              {%- endif -%}
            card_mod:
              class: glass
              style:
                ha-markdown$: >
                  /* Flex row so the icon centres on the text instead of sitting
                  on its baseline */

                  p {
                    margin: 0 !important;
                    display: flex;
                    align-items: center;
                    gap: 6px;
                  }

                  ha-icon {
                    --mdc-icon-size: 18px;
                    display: flex;
                  }
                .: >
                  /* Same glass as everything else, with the error colour as the
                  only accent */

                  ha-card {
                    border-color: var(--error-color) !important;
                    color: var(--error-color);
                  }
