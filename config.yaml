swipe_nav:
  wrap: false
  animate: swipe
kiosk_mode:
  kiosk: true
navbar-templates:
  default:
    desktop:
      position: bottom
    routes:
      - url: /dashboard-home/homelab
        icon: mdi:server
        badge:
          show: |
            [[[
              // Same checks as the attention strip on Homelab, so trouble shows from every view
              const st = (id) => states[id]?.state;
              const num = (id) => parseFloat(st(id));
              const services = ['truenas', 'nextcloud', 'vaultwarden', 'home_assistant', 'adguard',
                'homepage', 'pbs', 'ntfy', 'jellyfin', 'immich', 'jellyfin_stack', 'navidrome', 'nginxproxymanager'];
              const health = ['sensor.nas_pool_health', 'sensor.backups_pool_health', 'sensor.media_disk_health'];
              return services.some((s) => st(`binary_sensor.${s}_status`) === 'off')
                || ['off', 'unavailable'].includes(st('binary_sensor.download_vpn'))
                || st('binary_sensor.soulsync_soulseek') === 'off'
                || health.some((h) => st(h) !== 'ONLINE')
                || num('sensor.backups_failed_count') > 0
                || num('sensor.amondsen_uk_days_until_expiration') < 30
                || num('sensor.storage_local_lvm_storage_usage_percentage_2') > 85
                || num('sensor.storage_library_available_storage') < 50;
            ]]]
          color: var(--error-color)
      - url: /dashboard-home/home
        icon: mdi:home
      - url: /dashboard-home/planner
        icon: mdi:notebook
      - icon: |
          [[[
            // First load of a session only (app opened, new tab): land on the right dashboard's Home.
            // Phones get the phone dashboard, everything else the PC one. HA can't pick a start view itself.
            const editing = window.location.search.includes('disable_km');
            if (!editing && !sessionStorage.getItem('ha-landed')) {
              sessionStorage.setItem('ha-landed', '1');
              // A link that names a view (bookmark, notification) was opened on purpose, so leave it alone
              const nav = performance.getEntriesByType('navigation')[0];
              const firstPath = new URL(nav ? nav.name : window.location.href).pathname;
              const deepLinked = /^\/dashboard-(home|mobile)\/[^/]+/.test(firstPath);
              // Shortest screen side, so a phone held sideways still counts as a phone
              const isPhone = Math.min(screen.width, screen.height) < 600;
              const target = (isPhone ? '/dashboard-mobile' : '/dashboard-home') + '/home';
              if (!deepLinked && window.location.pathname !== target) {
                setTimeout(() => {
                  history.replaceState(null, '', target);
                  window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: true } }));
                }, 0);
              }
            }
            return editing ? 'mdi:check' : 'mdi:pencil';
          ]]]
        tap_action:
          action: custom-js-action
          code: |
            [[[
              // Pencil enters edit mode with kiosk off; tick reloads the clean URL to restore kiosk.
              // Full reloads because kiosk-mode only reads disable_km on page load and HA's Done leaves the URL as is
              const editing = window.location.search.includes('disable_km');
              window.location.href = window.location.pathname + (editing ? '' : '?disable_km&edit=1');
            ]]]
    styles: >
      /* Smaller icons and tighter spacing so the pill fits its items */

      .navbar {
        --navbar-route-icon-size: 20px;
      }

      .navbar-card.desktop.bottom {
        margin-bottom: 20px !important;
      }

      .navbar-card.desktop {
        padding: 4px 6px !important;
        gap: 2px !important;
      }

      .route {
        padding: 0 !important;
      }

      .button {
        width: 40px !important;
        height: 40px !important;
      }

      /* Hairline before the edit button so it doesn't read as another view;
         drawn inside the item's own box so the route can't clip it */
      .route:last-child {
        position: relative;
        margin-left: 2px;
        padding-left: 7px !important;
      }

      .route:last-child::before {
        content: '';
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 1px;
        background: var(--secondary-text-color);
        opacity: 0.35;
      }

      /* Glass pill, a step brighter than the 0.04 cards so the floating bar
      reads as raised */

      .navbar-card {
        background: rgba(255, 255, 255, 0.08) !important;
        backdrop-filter: blur(12px);
        border: 1px solid var(--divider-color) !important;
        border-radius: 12px !important;
        box-shadow: none !important;
      }

      /* Drop the filled square; the underline marks the active tab instead */

      .button,

      .button.active {
        background: transparent !important;
        position: relative;
      }

      .button.active::after {
        content: '';
        position: absolute;
        left: 25%;
        right: 25%;
        bottom: 2px;
        height: 2px;
        border-radius: 2px;
        background: var(--primary-text-color);
      }

      /* Dim inactive icons so the current tab stands out */

      .icon { color: var(--secondary-text-color); }

      .icon.active { color: var(--primary-text-color); }
views:
  - title: Home
    path: home
    theme: glass
    icon: mdi:home
    type: sections
    max_columns: 4
    header:
      card:
        type: markdown
        text_only: true
        content: >-
          {% set d = now().day %}

          {% set suf = 'th' if d in [11,12,13] else {1:'st',2:'nd',3:'rd'}.get(d
          % 10, 'th') %}

          # {{ now().strftime('%H:%M') }}

          {{ now().strftime('%A') }}, {{ d }}{{ suf }} {{ now().strftime('%B
          %Y') }}
        card_mod:
          style:
            ha-markdown$: |
              h1 {
                font-size: 6.5em !important;
                font-weight: 700 !important;
                margin: 0 !important;
                line-height: 1 !important;
                letter-spacing: -0.02em;
              }
              p {
                font-size: 1.4em !important;
                opacity: 0.6;
                margin: 10px 0 0 0 !important;
              }
            .: |
              ha-card {
                text-align: center;
                background: none;
                border: none;
                box-shadow: none;
                padding-top: 80px !important;
                padding-bottom: 60px !important;
              }
    footer:
      card:
        type: custom:navbar-card
        template: default
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Newcastle
            show_current: true
            show_forecast: false
            forecast_type: hourly
            grid_options:
              rows: auto
            card_mod:
              class: glass
              style: >
                /* Same height as the media player opposite, with the content
                centred in it */

                ha-card {
                  height: 110px !important;
                  min-height: 0 !important;
                  padding: 12px !important;
                  box-sizing: border-box;
                  display: flex;
                  flex-direction: column;
                  justify-content: center;
                }
          - type: custom:bubble-card
            card_type: separator
            name: Events
            icon: mdi:calendar-star
            sub_button:
              - icon: mdi:calendar-plus
                show_background: true
                tap_action:
                  action: navigate
                  navigation_path: '#add-event'
          - type: custom:calendar-card-pro
            entities:
              - entity: calendar.55namoamondsen_gmail_com
                accent_color: home-assistant
                label: home-assistant
              - entity: calendar.my_timetable
                show_location: false
                accent_color: '#5B7FBF'
                label: home-assistant
            background_color: rgba(255, 255, 255, 0.04)
            max_height: 300px
            time_24h: true
            day_font_size: 28px
            weekday_font_size: 15px
            month_font_size: 13px
            event_font_size: 15px
            time_font_size: 13px
            tap_action:
              action: url
              url_path: https://calendar.google.com
            card_mod:
              class: glass
          - type: custom:bubble-card
            card_type: separator
            name: Shifts
            icon: phu:mcdonalds
          - type: custom:calendar-card-pro
            entities:
              - entity: calendar.work
                show_location: false
                accent_color: '#E4D80C'
            days_to_show: 30
            background_color: rgba(255, 255, 255, 0.04)
            compact_events_to_show: 3
            time_24h: true
            day_font_size: 28px
            weekday_font_size: 15px
            month_font_size: 13px
            event_font_size: 15px
            time_font_size: 13px
            tap_action:
              action: url
              url_path: https://calendar.google.com
            card_mod:
              class: glass
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: '#add-event'
                name: Add event
                icon: mdi:calendar-plus
                bg_color: '#141414'
                bg_opacity: '75'
                bg_blur: '16'
                open_action:
                  action: perform-action
                  perform_action: script.calendar_form_prepare
              - type: entities
                card_mod:
                  class: glass
                entities:
                  - entity: input_text.event_title
                    card_mod:
                      style:
                        hui-generic-entity-row $: >
                          /* HA internals (entity rows, wa-input fields):
                          recheck these after HA updates */

                          state-badge {
                            display: none;
                          }
                        ha-input $: |
                          wa-input::part(input)::placeholder {
                            color: transparent !important;
                          }
                  - entity: input_text.event_description
                    card_mod:
                      style:
                        hui-generic-entity-row $: |
                          state-badge {
                            display: none;
                          }
                        ha-input $: |
                          wa-input::part(input)::placeholder {
                            color: transparent !important;
                          }
                  - entity: input_text.event_location
                    card_mod:
                      style:
                        hui-generic-entity-row $: |
                          state-badge {
                            display: none;
                          }
                        ha-input $: |
                          wa-input::part(input)::placeholder {
                            color: transparent !important;
                          }
                  - entity: input_datetime.event_start
                    card_mod:
                      style:
                        hui-generic-entity-row $: >
                          state-badge,

                          .info {
                            display: none;
                          }

                          /* HA right-aligns date + time; spread them edge to
                          edge instead */

                          ::slotted(div.both) {
                            justify-content: space-between !important;
                          }
                  - entity: input_select.event_duration
                    card_mod:
                      style:
                        hui-generic-entity-row $: |
                          state-badge {
                            display: none;
                          }
                  - entity: input_select.event_calendar
                    card_mod:
                      style:
                        hui-generic-entity-row $: |
                          state-badge {
                            display: none;
                          }
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Add to calendar
                icon: mdi:calendar-check
                tap_action:
                  action: perform-action
                  perform_action: script.calendar_form_add
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.calendar_form_add
                styles: |
                  .bubble-button-card-container {
                    background: rgba(255, 255, 255, 0.04) !important;
                    backdrop-filter: blur(12px);
                    border: 1px solid var(--divider-color);
                    border-radius: 12px !important;
                  }
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: sensor.navidrome_now_playing
                  state: /^(?!Nothing playing$|unavailable$|unknown$)/
                  options:
                    type: markdown
                    tap_action:
                      action: url
                      url_path: https://navidrome.home.amondsen.uk
                    content: >-
                      {%- set e = 'sensor.navidrome_now_playing' -%}

                      {%- set c = states('sensor.navidrome_cover') -%}

                      <table><tr>

                      <td>{% if c.startswith('http') %}<img src="{{ c }}">{%
                      else %}<ha-icon icon="mdi:music"></ha-icon>{% endif
                      %}</td>

                      <td><b>{{ state_attr(e, 'title') }}</b><br>{{
                      state_attr(e, 'artist') }}<br><small>Navidrome · {{
                      state_attr(e, 'playerName') }}</small></td>

                      </tr></table>
                    card_mod:
                      class: glass
                      style:
                        ha-markdown$: >
                          /* Same shape as the Bubble media player: 86px square
                          cover on the left, text beside it */

                          table {
                            border-collapse: collapse;
                            width: 100%;
                          }

                          td {
                            padding: 0 !important;
                            border: none !important;
                            vertical-align: middle;
                          }

                          td:first-child {
                            width: 86px;
                          }

                          td + td {
                            padding-left: 14px !important;
                            font-size: 13px;
                            line-height: 1.4;
                          }

                          td + td b {
                            font-size: 14px;
                          }

                          img {
                            width: 86px;
                            height: 86px;
                            border-radius: 8px !important;
                            object-fit: cover;
                            display: block;
                          }

                          ha-icon {
                            --mdc-icon-size: 40px;
                            display: flex;
                            justify-content: center;
                            width: 86px;
                            opacity: 0.5;
                          }

                          small {
                            opacity: 0.5;
                          }
                        .: >
                          /* Same 110px height as the Bubble media player; the
                          markdown card's own padding is dropped */

                          ha-card {
                            height: 110px !important;
                            padding: 12px 12px 12px 8px !important;
                            box-sizing: border-box;
                            display: flex;
                            align-items: center;
                            overflow: hidden !important;
                          }

                          ha-markdown {
                            padding: 0 !important;
                            width: 100%;
                            overflow: hidden;
                          }
                - entity_id: media_player.spotify_nathan
                  state: /^(playing|paused)$/
                  options:
                    type: custom:bubble-card
                    card_type: media-player
                    name: Spotify
                    card_layout: large
                    button_action:
                      tap_action:
                        action: url
                        url_path: https://open.spotify.com
                    styles: |
                      .bubble-media-player-container {
                        height: 110px !important;
                        background: rgba(255, 255, 255, 0.04) !important;
                        backdrop-filter: blur(12px);
                        border: 1px solid var(--divider-color);
                        border-radius: 12px !important;
                      }
                      .bubble-icon-container,
                      .bubble-entity-picture {
                        width: 86px !important;
                        height: 86px !important;
                        min-width: 86px !important;
                        border-radius: 8px !important;
                      }
                      .bubble-play-pause-button {
                        background-color: rgba(255, 255, 255, 0.12) !important;
                      }
                - integration: jellyfin
                  domain: media_player
                  state: /^(playing|paused)$/
                  options:
                    type: custom:bubble-card
                    card_type: media-player
                    card_layout: large
                    button_action:
                      tap_action:
                        action: url
                        url_path: https://jellyfin.home.amondsen.uk
                    styles: |
                      .bubble-media-player-container {
                        height: 110px !important;
                        background: rgba(255, 255, 255, 0.04) !important;
                        backdrop-filter: blur(12px);
                        border: 1px solid var(--divider-color);
                        border-radius: 12px !important;
                      }
                      .bubble-icon-container,
                      .bubble-entity-picture {
                        width: 86px !important;
                        height: 86px !important;
                        min-width: 86px !important;
                        border-radius: 8px !important;
                      }
                      .bubble-play-pause-button {
                        background-color: rgba(255, 255, 255, 0.12) !important;
                      }
            else:
              type: custom:bubble-card
              card_type: media-player
              entity: media_player.spotify_nathan
              name: Spotify
              card_layout: large
              button_action:
                tap_action:
                  action: url
                  url_path: https://open.spotify.com
              styles: |
                .bubble-media-player-container {
                  height: 110px !important;
                  background: rgba(255, 255, 255, 0.04) !important;
                  backdrop-filter: blur(12px);
                  border: 1px solid var(--divider-color);
                  border-radius: 12px !important;
                }
                .bubble-icon-container,
                .bubble-entity-picture {
                  width: 86px !important;
                  height: 86px !important;
                  min-width: 86px !important;
                  border-radius: 8px !important;
                }
                .bubble-play-pause-button {
                  background-color: rgba(255, 255, 255, 0.12) !important;
                }
          - type: custom:bubble-card
            card_type: separator
            name: Devices
            icon: mdi:devices
          - type: heading
            heading: S25 Ultra
            heading_style: subtitle
            icon: mdi:cellphone
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.s25_ultra_battery_level
