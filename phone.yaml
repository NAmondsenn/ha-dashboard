swipe_nav:
  wrap: false
  animate: swipe
kiosk_mode:
  kiosk: true
navbar-templates:
  mobile:
    desktop:
      position: bottom
    mobile:
      mode: floating
    routes:
      - url: /dashboard-mobile/homelab
        icon: mdi:server
        badge:
          show: |
            [[[
              // Lit when sensor.homelab_issues finds anything (checks in custom_templates/homelab.jinja),
              // so trouble shows from every view
              return parseInt(states['sensor.homelab_issues']?.state) > 0;
            ]]]
          color: var(--error-color)
      - url: /dashboard-mobile/home
        icon: mdi:home
      - url: /dashboard-mobile/planner
        icon: mdi:notebook
      - icon: |
          [[[
            // First load of a session only (app opened, new tab): land on the right dashboard's Home.
            // Phones get the phone dashboard, everything else the PC one. HA can't pick a start view itself.
            const editing = window.location.search.includes('disable_km');
            if (!editing && !sessionStorage.getItem('ha-landed')) {
              sessionStorage.setItem('ha-landed', '1');
              // A link that names a view (bookmark, notification) was opened on purpose, so leave it alone
              const nav = performance.getEntriesByType('navigation')[0];
              const firstPath = new URL(nav ? nav.name : window.location.href).pathname;
              const deepLinked = /^\/dashboard-(home|mobile)\/[^/]+/.test(firstPath);
              // Shortest screen side, so a phone held sideways still counts as a phone
              const isPhone = Math.min(screen.width, screen.height) < 600;
              const target = (isPhone ? '/dashboard-mobile' : '/dashboard-home') + '/home';
              if (!deepLinked && window.location.pathname !== target) {
                setTimeout(() => {
                  history.replaceState(null, '', target);
                  window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: true } }));
                }, 0);
              }
            }
            return editing ? 'mdi:check' : 'mdi:pencil';
          ]]]
        tap_action:
          action: custom-js-action
          code: |
            [[[
              // Pencil enters edit mode with kiosk off; tick reloads the clean URL to restore kiosk.
              // Also the only way out of kiosk on the phone, since kiosk hides the sidebar
              const editing = window.location.search.includes('disable_km');
              window.location.href = window.location.pathname + (editing ? '' : '?disable_km&edit=1');
            ]]]
    styles: >
      /* Same pill as the desktop navbar, with bigger touch targets for thumbs
      */

      .navbar {
        --navbar-route-icon-size: 22px;
      }

      .navbar-card.desktop.bottom {
        margin-bottom: 20px !important;
      }

      .navbar-card {
        padding: 4px 6px !important;
        gap: 4px !important;
      }

      .route {
        padding: 0 !important;
      }

      .button {
        width: 48px !important;
        height: 44px !important;
      }

      /* Hairline before the edit button so it doesn't read as another view;
         drawn inside the item's own box so the route can't clip it */
      .route:last-child {
        position: relative;
        margin-left: 2px;
        padding-left: 7px !important;
      }

      .route:last-child::before {
        content: '';
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 1px;
        background: var(--secondary-text-color);
        opacity: 0.35;
      }

      /* Glass pill, a step brighter than the 0.04 cards so the floating bar
      reads as raised */

      .navbar-card {
        background: rgba(255, 255, 255, 0.08) !important;
        backdrop-filter: blur(12px);
        border: 1px solid var(--divider-color) !important;
        border-radius: 12px !important;
        box-shadow: none !important;
      }

      /* Drop the filled square; the underline marks the active tab instead */

      .button,

      .button.active {
        background: transparent !important;
        position: relative;
      }

      .button.active::after {
        content: '';
        position: absolute;
        left: 25%;
        right: 25%;
        bottom: 2px;
        height: 2px;
        border-radius: 2px;
        background: var(--primary-text-color);
      }

      /* Dim inactive icons so the current tab stands out */

      .icon { color: var(--secondary-text-color); }

      .icon.active { color: var(--primary-text-color); }
views:
  - title: Homelab
    path: homelab
    theme: glass
    icon: mdi:server
    type: sections
    max_columns: 2
    header:
      layout: start
      card:
        type: markdown
        text_only: true
        content: '# Homelab'
        card_mod:
          style:
            ha-markdown$: |
              h1 {
                text-align: left !important;
                font-size: 2.8em !important;
                font-weight: 700 !important;
                margin: 0 !important;
                line-height: 1 !important;
                letter-spacing: -0.02em;
              }
            .: |
              ha-card {
                text-align: left !important;
                background: none;
                border: none;
                box-shadow: none;
                padding-top: 12px !important;
                padding-bottom: 24px !important;
              }
    footer:
      card:
        type: custom:navbar-card
        template: mobile
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              {#- Always shown on the phone as the one-glance summary. The
              checks are in
                  custom_templates/homelab.jinja (sensor.homelab_issues), shared with the desktop strip and the badges. -#}
              {%- set issues = state_attr('sensor.homelab_issues', 'issues') or
              [] -%}

              {%- if issues %}

              ### <ha-icon icon="mdi:alert-circle-outline"></ha-icon> {{ issues
              | count }} {{ 'issue' if issues | count == 1 else 'issues' }}


              {% for i in issues -%}

              - {{ i }}

              {% endfor -%}

              {%- else %}

              ### <ha-icon icon="mdi:check-circle-outline"></ha-icon> All
              systems OK


              {{ state_attr('sensor.homelab_issues', 'services') }} services up
              · all checks passing

              {%- endif %}
            card_mod:
              class: glass
              style:
                ha-markdown$: >
                  h3 {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    margin: 0 0 4px 0 !important;
                    font-size: 1.15em !important;
                  }

                  /* Red only when something is wrong; the all-clear stays
                  monochrome */

                  h3:has(ha-icon[icon="mdi:alert-circle-outline"]) {
                    color: var(--error-color);
                  }

                  ha-icon {
                    --mdc-icon-size: 22px;
                    display: flex;
                  }

                  p, ul {
                    margin: 0 !important;
                    opacity: 0.7;
                  }

                  ul {
                    padding-left: 20px;
                  }
