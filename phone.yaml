  - title: Home
    path: home
    theme: glass
    icon: mdi:home
    type: sections
    max_columns: 2
    header:
      layout: start
      card:
        type: markdown
        text_only: true
        content: >-
          {%- set d = now().day -%}

          {%- set suf = 'th' if d in [11,12,13] else
          {1:'st',2:'nd',3:'rd'}.get(d % 10, 'th') -%}

          {%- set w = 'weather.forecast_home' -%}

          {%- set t = state_attr(w, 'temperature') -%}

          {%- set conds = {
            'clear-night': ['Clear', 'weather-night'], 'cloudy': ['Cloudy', 'weather-cloudy'],
            'fog': ['Fog', 'weather-fog'], 'hail': ['Hail', 'weather-hail'],
            'lightning': ['Lightning', 'weather-lightning'], 'lightning-rainy': ['Storms', 'weather-lightning-rainy'],
            'partlycloudy': ['Partly cloudy', 'weather-partly-cloudy'], 'pouring': ['Pouring', 'weather-pouring'],
            'rainy': ['Rain', 'weather-rainy'], 'snowy': ['Snow', 'weather-snowy'],
            'snowy-rainy': ['Sleet', 'weather-snowy-rainy'], 'sunny': ['Sunny', 'weather-sunny'],
            'windy': ['Windy', 'weather-windy'], 'windy-variant': ['Windy', 'weather-windy-variant'],
            'exceptional': ['Warning', 'alert-circle-outline']} -%}
          {%- set cond = conds.get(states(w), [states(w), 'weather-cloudy']) -%}

          {%- set h = now().hour -%}

          Good {{ 'morning' if 5 <= h < 12 else 'afternoon' if 12 <= h < 17 else
          'evening' }},


          # Nathaniel


          {{ now().strftime('%A') }}, {{ d }}{{ suf }} {{ now().strftime('%B')
          }}


          {% if t is number %}<ha-icon icon="mdi:{{ cond[1] }}"></ha-icon> {{ t
          | round | int }}° {{ cond[0] }}{% endif %}
        card_mod:
          style:
            ha-markdown$: |
              h1, p {
                text-align: left !important;
              }
              /* Greeting: a quieter line above the name */
              p:nth-of-type(1) {
                font-size: 1.75em !important;
                font-weight: 500;
                opacity: 0.65;
                margin: 0 !important;
              }
              h1 {
                font-size: 3.4em !important;
                font-weight: 700 !important;
                margin: 2px 0 0 0 !important;
                line-height: 1 !important;
                letter-spacing: -0.02em;
              }
              /* Date: small and grey under the name */
              p:nth-of-type(2) {
                font-size: 1.15em !important;
                opacity: 0.55;
                margin: 10px 0 0 0 !important;
              }
              /* Weather line */
              p:nth-of-type(3) {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                gap: 8px;
                font-size: 1.1em !important;
                opacity: 0.85;
                margin: 14px 0 0 0 !important;
              }
              p:nth-of-type(3) ha-icon {
                --mdc-icon-size: 26px;
              }
            .: |
              ha-card {
                text-align: left !important;
                background: none;
                border: none;
                box-shadow: none;
                padding-top: 12px !important;
                padding-bottom: 24px !important;
              }
    footer:
      card:
        type: custom:navbar-card
        template: mobile
    sections:
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: sensor.navidrome_now_playing
                  state: /^(?!Nothing playing$|unavailable$|unknown$)/
                  options:
                    type: markdown
                    tap_action:
                      action: url
                      url_path: https://navidrome.home.amondsen.uk
                    content: >-
                      {%- set e = 'sensor.navidrome_now_playing' -%}

                      {%- set n = (state_attr(e, 'entry') or [{}]) | first -%}

                      {%- set c = states('sensor.navidrome_cover') -%}

                      <table><tr>

                      <td>{% if c.startswith('http') %}<img src="{{ c }}">{%
                      else %}<ha-icon icon="mdi:music"></ha-icon>{% endif
                      %}</td>

                      <td><b>{{ n.title }}</b><br>{{ n.artist
                      }}<br><small>Navidrome · {{ n.playerName }}</small></td>

                      </tr></table>
                    card_mod:
                      class: glass
                      style:
                        ha-markdown$: >
                          /* Same shape as the Bubble media player: 86px square
                          cover on the left, text beside it */

                          table {
                            border-collapse: collapse;
                            width: 100%;
                          }

                          td {
                            padding: 0 !important;
                            border: none !important;
                            vertical-align: middle;
                          }

                          td:first-child {
                            width: 86px;
                          }

                          td + td {
                            padding-left: 14px !important;
                            font-size: 13px;
                            line-height: 1.4;
                          }

                          td + td b {
                            font-size: 14px;
                          }

                          img {
                            width: 86px;
                            height: 86px;
                            border-radius: 8px !important;
                            object-fit: cover;
                            display: block;
                          }

                          ha-icon {
                            --mdc-icon-size: 40px;
                            display: flex;
                            justify-content: center;
                            width: 86px;
                            opacity: 0.5;
                          }

                          small {
                            opacity: 0.5;
                          }
                        .: >
                          /* Same 110px height as the Bubble media player; the
                          markdown card's own padding is dropped */

                          ha-card {
                            height: 110px !important;
                            padding: 12px 12px 12px 8px !important;
                            box-sizing: border-box;
                            display: flex;
                            align-items: center;
                            overflow: hidden !important;
                          }

                          ha-markdown {
                            padding: 0 !important;
                            width: 100%;
                            overflow: hidden;
                          }
                - entity_id: media_player.spotify_nathan
                  state: /^(playing|paused)$/
                  options:
                    type: custom:bubble-card
                    card_type: media-player
                    name: Spotify
                    card_layout: large
