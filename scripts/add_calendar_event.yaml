# Used by the Add event buttons on both dashboards. Tapping the script opens
# HA's form for these fields; Run creates the event in Google Calendar.
# Paste this whole file into Settings > Automations & scenes > Scripts >
# Create script > ⋮ > Edit in YAML, and save it with the entity ID script.add_calendar_event.
alias: Add calendar event
icon: mdi:calendar-plus
mode: single
fields:
  title:
    name: Title
    required: true
    selector:
      text:
  description:
    name: Description
    selector:
      text:
        multiline: true
  location:
    name: Location
    selector:
      text:
  start:
    name: Start
    required: true
    selector:
      datetime:
  duration:
    name: Duration
    description: For all-day events, the number of days
    default:
      hours: 1
      minutes: 0
      seconds: 0
    selector:
      duration:
        enable_day: true
  all_day:
    name: All day
    default: false
    selector:
      boolean:
  calendar:
    name: Calendar
    default: calendar.55namoamondsen_gmail_com
    selector:
      entity:
        filter:
          domain: calendar
sequence:
  - variables:
      cal: "{{ calendar | default('calendar.55namoamondsen_gmail_com', true) }}"
      whole_day: "{{ all_day | default(false) | bool }}"
      d: "{{ duration if duration is mapping else {'hours': 1} }}"
  - variables:
      minutes: >-
        {{ [ (d.get('days', 0) | int) * 1440 + (d.get('hours', 0) | int) * 60
             + (d.get('minutes', 0) | int), 1 ] | max }}
      days: "{{ [d.get('days', 0) | int, 1] | max }}"
  - if:
      - condition: template
        value_template: "{{ whole_day }}"
    then:
      - action: calendar.create_event
        target:
          entity_id: "{{ cal }}"
        data:
          summary: "{{ title }}"
          description: "{{ description | default('') }}"
          location: "{{ location | default('') }}"
          start_date: "{{ as_datetime(start).date() }}"
          end_date: "{{ (as_datetime(start) + timedelta(days=days | int)).date() }}"
    else:
      - action: calendar.create_event
        target:
          entity_id: "{{ cal }}"
        data:
          summary: "{{ title }}"
          description: "{{ description | default('') }}"
          location: "{{ location | default('') }}"
          start_date_time: "{{ as_datetime(start).strftime('%Y-%m-%d %H:%M:%S') }}"
          end_date_time: >-
            {{ (as_datetime(start) + timedelta(minutes=minutes | int)).strftime('%Y-%m-%d %H:%M:%S') }}
